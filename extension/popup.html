<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POIDH local image scan</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Local image scan</h1>
      <p class="notice">
        Inference is not bundled yet. Scans currently mark detected images as unavailable.
      </p>
      <button id="scan-page" type="button">Scan images on this page</button>
      <p id="scan-status" role="status" aria-live="polite">Ready to scan.</p>
    </main>
  </body>
</html>
