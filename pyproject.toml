[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poidh-ai-detector"
version = "0.0.0"
description = "Local-only Chrome image detector with a reproducible H100 training path"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anthony Lannoote" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]
training = [
    "huggingface-hub>=0.30,<2",
    "numpy>=2.2,<3",
    "onnx>=1.18,<2",
    "onnxruntime>=1.22,<2",
    "pillow>=11,<13",
    "pyarrow>=20,<26",
    "timm>=1.0,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[tool.setuptools.packages.find]
include = ["poidh_benchmark*", "poidh_detector*", "tools*"]

[tool.ruff]
target-version = "py311"
